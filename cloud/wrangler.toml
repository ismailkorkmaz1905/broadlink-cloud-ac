name = "klima-sensor"
main = "src/index.js"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "klima-sensor"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
