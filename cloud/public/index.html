<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oda iklimi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root{--bg:#0b1020;--text:#f1f5f9;--muted:#9fb0c8;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--cool:#38bdf8;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.orbs i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:#6d28d9}
.orbs i:nth-child(2){width:50vmax;height:50vmax;right:-18vmax;top:20vh;background:#0ea5e9}
.orbs i:nth-child(3){width:45vmax;height:45vmax;left:5vw;bottom:-22vmax;background:#f97316;opacity:.35}
main{max-width:620px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:grid;gap:14px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:0 10px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18)}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
h1{margin:0;font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid var(--line)}
.badge.ok{color:var(--ok)}.badge.bad{color:var(--bad)}
.now{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.temp{font-size:84px;line-height:1;font-weight:200;letter-spacing:-.03em}
.temp sup{font-size:32px;font-weight:300;color:var(--muted);vertical-align:top;position:relative;top:10px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:300;padding-bottom:8px}
.ring small{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:10px;color:var(--muted)}
.state{margin-top:12px;font-size:15px}
.meta{margin-top:6px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.2);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px;border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:rgba(255,255,255,.16);color:var(--text)}
.chart{width:100%;height:170px;display:block;touch-action:none}
.chart text{fill:#9fb0c8;font-size:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 6px}
.stats{font-size:12px;color:var(--muted)}
.tip{min-height:20px;font-size:13px;margin:8px 0}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cfg label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input,select{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px;font:inherit;font-size:16px}
button.save{margin-top:12px;width:100%;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:600;color:#0b1020;background:linear-gradient(135deg,#7dd3fc,#c4b5fd)}
.links{display:flex;gap:14px;font-size:13px}.links a{color:var(--cool);text-decoration:none}
.auto{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:15px}
.auto small{display:block;font-size:12px;color:var(--muted)}
.auto input{width:50px;height:30px;accent-color:#7dd3fc}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ac button{border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--text);border-radius:14px;padding:12px;font:inherit}
.rule{font-size:13px;color:var(--muted);margin:10px 0 0}
.decision{margin-top:10px;padding:12px;border-radius:14px;background:rgba(0,0,0,.22);font-size:14px}
.hr{display:flex;align-items:center;gap:10px}.langs{display:flex;gap:6px}.langs button{border:2px solid transparent;background:none;padding:0;border-radius:6px;line-height:0;opacity:.55;cursor:pointer}.langs button.on{opacity:1;border-color:rgba(255,255,255,.7)}.langs img{width:28px;height:19px;border-radius:3px;display:block}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:0}
@media(prefers-reduced-motion:no-preference){.orbs i{animation:d 24s ease-in-out infinite alternate}.orbs i:nth-child(2){animation-duration:30s}.orbs i:nth-child(3){animation-duration:36s}@keyframes d{to{transform:translate(6vmax,4vmax)}}}
</style>
</head>
<body>
<div class="orbs"><i></i><i></i><i></i></div>
<main>
<header><h1 data-i18n="h1">ODANIN İKLİMİ</h1><div class="hr"><div class="langs" id="langs"><button type="button" data-lang="tr" aria-label="Türkçe" title="Türkçe"><img src="/flags/tr.svg" alt="TR"></button><button type="button" data-lang="en" aria-label="English" title="English"><img src="/flags/gb.svg" alt="EN"></button></div><span class="badge" id="badge">...</span></div></header>
<section class="glass">
  <div class="now">
    <div><div class="label" data-i18n="temp">Sıcaklık</div><div class="temp"><span id="t">--</span><sup>°C</sup></div></div>
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="8"/><circle id="arc" cx="50" cy="50" r="42" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264"/><defs><linearGradient id="g"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg><b id="h">--</b><small data-i18n="hum">NEM</small></div>
  </div>
  <div class="state" id="state" data-i18n="waiting">Ölçüm bekleniyor</div>
  <div class="meta" id="meta"></div>
</section>
<section class="glass">
  <div class="tabs" id="tabs"><button data-r="6s" class="on" data-i18n="r6">6 saat</button><button data-r="24s" data-i18n="r24">24 saat</button><button data-r="7g" data-i18n="r7">7 gün</button></div>
  <div class="row"><span class="label" data-i18n="tempChart">Sıcaklık (°C)</span><span class="stats" id="ts"></span></div>
  <svg class="chart" id="ct"></svg>
  <div class="row" style="margin-top:14px"><span class="label" data-i18n="humChart">Nem (%)</span><span class="stats" id="hs"></span></div>
  <svg class="chart" id="ch"></svg>
  <div class="tip" id="tip" data-i18n="tip">Yeşil bant konfor aralığıdır. Grafiğe dokunarak değerleri gör.</div>
  <div class="links"><a id="csv" href="#" data-i18n="csv">CSV indir</a><a id="json" href="#" data-i18n="json">JSON indir</a></div>
</section>
<section class="glass">
  <div class="label" data-i18n="decisionTitle">Klima kararı</div>
  <div class="decision" id="decision">...</div>
  <p class="rule" id="rule"></p>
  <label class="auto"><span><span data-i18n="auto">Otomatik klima kontrolü</span><small data-i18n="autoHint">Kapalıyken klima hiç kendiliğinden çalışmaz.</small></span><input id="auto" type="checkbox"></label>
  <div class="ac"><button id="acon" data-i18n="acon">Soğutmayı aç</button><button id="acoff" data-i18n="acoff">Kapat</button></div>
  <div class="cfg">
    <label><span data-i18n="target">Elle açarken hedef (°C)</span><input id="target" type="number" step="1" min="18" max="30" inputmode="numeric"></label>
    <label><span data-i18n="fan">Elle açarken fan</span><select id="fan"><option value="auto" data-i18n="f_auto">Otomatik</option><option value="high" data-i18n="f_high">Yüksek</option><option value="med" data-i18n="f_med">Orta</option><option value="low" data-i18n="f_low">Düşük</option><option value="quiet" data-i18n="f_quiet">Sessiz</option></select></label>
  </div>
  <div class="meta" id="acstate"></div>
</section>
<section class="glass">
  <div class="label" data-i18n="comfort">Konfor aralığı</div>
  <div class="cfg">
    <label><span data-i18n="tmin">Sıcaklık en düşük (°C)</span><input id="tmin" type="number" step="0.5" inputmode="decimal"></label>
    <label><span data-i18n="tmax">Sıcaklık en yüksek (°C)</span><input id="tmax" type="number" step="0.5" inputmode="decimal"></label>
    <label><span data-i18n="hmin">Nem en düşük (%)</span><input id="hmin" type="number" step="1" inputmode="numeric"></label>
    <label><span data-i18n="hmax">Nem en yüksek (%)</span><input id="hmax" type="number" step="1" inputmode="numeric"></label>
  </div>
  <button class="save" id="save" data-i18n="save">Kaydet</button>
  <div class="meta" id="cfgmsg"></div>
</section>
<p class="foot" data-i18n="foot">Veri BroadLink bulutundan dakikada bir okunur · Saatler Singapur saati</p>
</main>
<script type="module">
import { plan, describe, setpoint, FAN_LABELS } from '/policy.js';
import { I18N, LANGS } from '/i18n.js';
const $ = id => document.getElementById(id);
let range = '6s', cfg = { tMin: 23, tMax: 26, hMin: 40, hMax: 60, auto: false }, sample = null, pts = [];
const LOCALE = { tr: 'tr-TR', en: 'en-GB' };
let lang = 'tr', clock, hm, dm, acState = null, acMsg = null, cfgMsg = null;
const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const pct = n => (lang === 'tr' ? '%' + n : n + '%');
const fanName = f => FAN_LABELS[lang][f] || f;
function setLocale() {
  const o = { timeZone: 'Asia/Singapore' };
  clock = new Intl.DateTimeFormat(LOCALE[lang], { ...o, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  hm = new Intl.DateTimeFormat(LOCALE[lang], { ...o, hour: '2-digit', minute: '2-digit' });
  dm = new Intl.DateTimeFormat(LOCALE[lang], { ...o, day: '2-digit', month: '2-digit' });
}
function pickLang() {
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch { /* storage may be blocked */ }
  return /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en';
}
const NS = 'http://www.w3.org/2000/svg';

function render() {
  const fresh = sample && Date.now() - sample.at < 180000;
  $('badge').textContent = !sample ? t('noData') : fresh ? t('live') : t('stale');
  $('badge').className = 'badge ' + (!sample ? '' : fresh ? 'ok' : 'bad');
  $('rule').textContent = describe(cfg, lang);
  if (!sample) { $('decision').textContent = t('noReading'); return; }
  $('t').textContent = sample.temperature.toFixed(1);
  $('h').textContent = pct(Math.round(sample.humidity));
  $('arc').style.strokeDashoffset = 264 * (1 - Math.min(100, sample.humidity) / 100);
  const parts = [];
  if (sample.temperature < cfg.tMin) parts.push(t('cool')); else if (sample.temperature > cfg.tMax) parts.push(t('hot'));
  if (sample.humidity < cfg.hMin) parts.push(t('dry')); else if (sample.humidity > cfg.hMax) parts.push(t('humid'));
  $('state').textContent = parts.length ? t('roomIs', parts.join(t('and'))) : t('inBand');
  $('meta').textContent = t('lastReading') + clock.format(sample.at) + (fresh ? '' : t('staleSuffix'));
  const p = plan(cfg, sample.temperature);
  const temp = sample.temperature.toFixed(1);
  const text = p.action === 'cool' ? t('decCool', temp, p.over.toFixed(1), p.target, fanName(p.fan))
    : p.action === 'off' ? t('decOff', temp) : t('decHold', temp);
  $('decision').textContent = text + (cfg.auto ? t('autoOn') : t('autoOff'));
}

function nice(lo, hi, n) {
  const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
const el = (name, attrs, text) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };

const geo = {};
function chart(svg, statEl, key, color, unit, band) {
  svg.replaceChildren();
  if (pts.length < 2) { statEl.textContent = ''; return; }
  const W = svg.clientWidth || 340, H = 170, L = 38, R = 10, T = 8, B = 22;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const xs = pts.map(p => p.at), ys = pts.map(p => p[key]);
  const x0 = xs[0], x1 = xs[xs.length - 1], lo = Math.min(...ys), hi = Math.max(...ys);
  const bLo = Math.min(lo, band[0]), bHi = Math.max(hi, band[1]), pad = (bHi - bLo || 1) * .1;
  const y0 = bLo - pad, y1 = bHi + pad;
  const X = v => L + (v - x0) / (x1 - x0 || 1) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  geo[key] = { X, L, R, W, x0, x1 };
  const defs = el('defs', {}), grad = el('linearGradient', { id: 'f' + key, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.append(el('stop', { offset: 0, 'stop-color': color, 'stop-opacity': .4 }), el('stop', { offset: 1, 'stop-color': color, 'stop-opacity': 0 }));
  defs.append(grad); svg.append(defs);
  for (const v of nice(y0, y1, 4)) {
    svg.append(el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: 'rgba(255,255,255,.1)' }));
    svg.append(el('text', { x: L - 6, y: Y(v) + 3, 'text-anchor': 'end' }, (Math.round(v * 10) / 10) + unit));
  }
  const fmtX = range === '7g' ? v => dm.format(v) : v => hm.format(v);
  for (let i = 0; i <= 4; i++) {
    const v = x0 + (x1 - x0) * i / 4;
    svg.append(el('line', { x1: X(v), x2: X(v), y1: T, y2: H - B, stroke: 'rgba(255,255,255,.06)' }));
    svg.append(el('text', { x: X(v), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle' }, fmtX(v)));
  }
  svg.append(el('rect', { x: L, y: Y(band[1]), width: W - L - R, height: Math.max(0, Y(band[0]) - Y(band[1])), fill: 'rgba(74,222,128,.13)' }));
  for (const b of band) svg.append(el('line', { x1: L, x2: W - R, y1: Y(b), y2: Y(b), stroke: '#4ade80', 'stroke-dasharray': '5 4', 'stroke-width': 1.2 }));
  const line = pts.map(p => X(p.at).toFixed(1) + ',' + Y(p[key]).toFixed(1)).join(' ');
  svg.append(el('polygon', { points: `${X(x0)},${H - B} ${line} ${X(x1)},${H - B}`, fill: `url(#f${key})` }));
  svg.append(el('polyline', { points: line, fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }));
  const last = pts[pts.length - 1];
  svg.append(el('circle', { cx: X(last.at), cy: Y(last[key]), r: 3.5, fill: color }));
  svg.append(el('line', { id: 'm' + key, y1: T, y2: H - B, stroke: '#fff', 'stroke-opacity': .5, visibility: 'hidden' }));
  const avg = ys.reduce((a, b) => a + b, 0) / ys.length;
  const [a, b, c] = t('stat'); statEl.textContent = `${a} ${lo.toFixed(1)} · ${b} ${avg.toFixed(1)} · ${c} ${hi.toFixed(1)}${unit}`;
}

function tipAt(e) {
  if (!pts.length) return;
  const svg = e.currentTarget, key = svg.id === 'ct' ? 'temperature' : 'humidity', g = geo[key];
  if (!g) return;
  const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * g.W;
  const at = g.x0 + Math.min(1, Math.max(0, (px - g.L) / (g.W - g.L - g.R))) * (g.x1 - g.x0);
  const p = pts.reduce((a, b) => Math.abs(b.at - at) < Math.abs(a.at - at) ? b : a);
  $('tip').textContent = clock.format(p.at) + ' · ' + p.temperature.toFixed(1) + ' °C · ' + pct(Math.round(p.humidity));
  for (const k of ['temperature', 'humidity']) {
    const m = document.getElementById('m' + k);
    if (m && geo[k]) { m.setAttribute('x1', geo[k].X(p.at)); m.setAttribute('x2', geo[k].X(p.at)); m.setAttribute('visibility', 'visible'); }
  }
}

function charts() {
  chart($('ct'), $('ts'), 'temperature', '#fb923c', '°', [cfg.tMin, cfg.tMax]);
  chart($('ch'), $('hs'), 'humidity', '#38bdf8', '%', [cfg.hMin, cfg.hMax]);
}

async function api(path, opts) {
  const r = await fetch(path, { cache: 'no-store', ...opts });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load() {
  try { const d = await api('/api/sensor?range=' + range); sample = d.sample; pts = d.samples || []; } catch { /* keep last values */ }
  render(); charts();
  $('csv').href = '/api/sensor?range=' + range + '&format=csv';
  $('json').href = '/api/sensor?range=' + range + '&format=json';
}

async function loadCfg() {
  try { const d = await api('/api/profile'); if (d.profile) cfg = { ...cfg, ...d.profile }; } catch { /* defaults */ }
  $('tmin').value = cfg.tMin; $('tmax').value = cfg.tMax; $('hmin').value = cfg.hMin; $('hmax').value = cfg.hMax;
  $('auto').checked = cfg.auto === true; $('target').value = setpoint(cfg);
  render(); charts();
}

async function saveCfg(next, msg) {
  try {
    await api('/api/profile', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next) });
    cfg = next; if (msg) { cfgMsg = msg; $('cfgmsg').textContent = t(msg); } render(); charts(); return true;
  } catch { if (msg) { cfgMsg = 'saveFail'; $('cfgmsg').textContent = t('saveFail'); } return false; }
}

$('save').onclick = () => {
  const next = { ...cfg, tMin: +$('tmin').value, tMax: +$('tmax').value, hMin: +$('hmin').value, hMax: +$('hmax').value };
  if (![next.tMin, next.tMax, next.hMin, next.hMax].every(Number.isFinite) || next.tMin >= next.tMax || next.hMin >= next.hMax) {
    cfgMsg = 'cfgInvalid'; $('cfgmsg').textContent = t('cfgInvalid'); return;
  }
  saveCfg(next, 'saved');
};

$('auto').onchange = async () => {
  const ok = await saveCfg({ ...cfg, auto: $('auto').checked });
  if (!ok) { $('auto').checked = cfg.auto === true; setAcMsg('autoFail'); }
};

function renderAc() {
  if (acMsg) { $('acstate').textContent = t(acMsg); return; }
  const s = acState;
  if (!s) { $('acstate').textContent = t('acUnknown'); return; }
  const what = s.power === 'on' ? t('cmdCool', s.target, fanName(s.fan)) : t('cmdOff');
  $('acstate').textContent = t('lastCmd') + what + ' · ' + hm.format(s.at) + (s.source === 'auto' ? t('srcAuto') : t('srcManual')) + (s.ok ? '' : t('cmdFailed'));
}
const setAcMsg = key => { acMsg = key; renderAc(); };

async function loadAc() {
  try {
    const { state } = await api('/api/ac');
    if (!state) return;
    acState = state; acMsg = null; renderAc();
  } catch { /* keep text */ }
}

async function ac(action) {
  setAcMsg('sending');
  const target = Math.round(+$('target').value);
  if (action === 'cool' && !(target >= 18 && target <= 30)) { setAcMsg('targetRange'); return; }
  try {
    await api('/api/ac', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, target, fan: $('fan').value }) });
  } catch { setAcMsg('sendFail'); return; }
  loadAc();
  if (action === 'cool') loadCfg(); // the server moves the comfort range to the new target
}
$('acon').onclick = () => ac('cool');
$('acoff').onclick = () => ac('off');

$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  range = b.dataset.r;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  load();
};
for (const id of ['ct', 'ch']) { $(id).addEventListener('pointermove', tipAt); $(id).addEventListener('pointerdown', tipAt); }
window.addEventListener('resize', charts);
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  setLocale();
  $('cfgmsg').textContent = cfgMsg ? t(cfgMsg) : '';
  render(); charts(); renderAc();
}
$('langs').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch { /* storage may be blocked */ }
  applyLang();
};
lang = pickLang();
applyLang();
