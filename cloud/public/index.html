<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Oda iklimi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
/* Bento: flat light page, grey trays, white cards, one dark card, ONE accent (signal blue). */
:root{--bg:#F7F7F5;--tray:#EEEEEA;--card:#FFFFFF;--dark:#0F0F12;--ink:#141416;--mut:#8B8B87;--mut2:#B8B8B3;--line:#E6E6E1;
  --acc:#2F5BFF;--acc2:#6E8BFF;--tint:#EEF2FF;--warm:#F2683C;--good:#2FB67C;--bad:#E5484D;
  --sh:0 1px 2px rgba(20,20,30,.05),0 8px 24px rgba(20,20,30,.05);--shc:0 1px 2px rgba(20,20,30,.06),0 4px 14px rgba(20,20,30,.05);
  --spring:cubic-bezier(.34,1.45,.64,1);--soft:cubic-bezier(.22,1,.36,1);--state:var(--acc)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0B0D;--tray:#17171A;--card:#1F1F23;--dark:#000;--ink:#F4F4F2;--mut:#8E8E93;--mut2:#5A5A60;--line:#2A2A2F;--tint:rgba(47,91,255,.18);--acc2:#8AA2FF;--sh:none;--shc:none}}
:root[data-theme="dark"]{--bg:#0B0B0D;--tray:#17171A;--card:#1F1F23;--dark:#000;--ink:#F4F4F2;--mut:#8E8E93;--mut2:#5A5A60;--line:#2A2A2F;--tint:rgba(47,91,255,.18);--acc2:#8AA2FF;--sh:none;--shc:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01","tnum";letter-spacing:-.01em;overflow-x:hidden}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
svg{display:block}
main{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));display:grid;gap:10px}
#cards{display:grid;gap:10px}

/* header */
header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 2px}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.02em}
.hr{display:flex;align-items:center;gap:6px}
.langs{display:flex;gap:4px;background:var(--tray);padding:3px;border-radius:999px}
.langs button{border:0;background:none;padding:4px 6px;border-radius:999px;line-height:0;opacity:.45;transition:background .25s,opacity .25s}
.langs button.on{opacity:1;background:var(--card);box-shadow:var(--shc)}
.langs img{width:20px;height:14px;border-radius:2px;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--tray);color:var(--mut)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--tint);color:var(--acc)}
.badge.ok i{animation:live 2s infinite}
.badge.bad{background:rgba(229,72,77,.12);color:var(--bad)}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(47,91,255,.5)}70%{box-shadow:0 0 0 6px rgba(47,91,255,0)}100%{box-shadow:0 0 0 0 rgba(47,91,255,0)}}
.gear{width:32px;height:32px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shc);display:grid;place-items:center;padding:0;color:var(--ink);transition:transform .5s var(--spring)}
.gear[aria-expanded=true]{transform:rotate(90deg);background:var(--ink);color:var(--bg)}

/* trays and cards */
.tray{background:var(--tray);border-radius:22px;padding:8px;display:grid;gap:8px}
.c{background:var(--card);border-radius:16px;box-shadow:var(--shc);padding:14px}
.c.dk{background:var(--dark);color:#fff;box-shadow:none}
.label{font-size:12px;font-weight:500;color:var(--mut)}
.c.dk .label,.c.dk small{color:#8B8B90}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta{font-size:12px;color:var(--mut)}
.center{text-align:center}

/* dial + metrics */
.heroRow{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px}
.dialc0{padding:10px 10px 8px}
.dial{position:relative;max-width:220px;margin:0 auto}
.dial svg{width:100%;height:auto;overflow:visible}
.dial text{fill:var(--mut);font-size:17px;font-weight:500}
#dTrack{stroke:var(--tray)}
#dBand{stroke:var(--acc);transition:d .6s var(--soft)}
#dTarget{stroke:var(--ink)}
#needle{transform:rotate(135deg);transform-origin:150px 150px;transition:transform 1.2s var(--spring)}
#needle circle{fill:var(--card);stroke:var(--state);stroke-width:7;transition:stroke .8s}
.dialv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:14%;pointer-events:none}
.big{font-size:44px;font-weight:300;letter-spacing:-.05em;line-height:1;position:relative}
.big sup{position:absolute;left:100%;top:.12em;font-size:.3em;letter-spacing:0;color:var(--mut);font-weight:500;margin-left:2px}
.state{margin-top:4px;font-size:12.5px;font-weight:600;color:var(--state);transition:color .8s;white-space:nowrap}
.dialc0 .meta{text-align:center;margin-top:2px;font-size:11px}
.pills{display:grid;gap:8px}
.pill{padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.pill small{font-size:11px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill b{font-size:19px;font-weight:600;letter-spacing:-.03em;margin-top:1px}

/* rolling digits */
.rl{display:inline-flex;vertical-align:top;overflow:hidden;height:1.12em;line-height:1.12em}
.rc{display:inline-block;height:1.12em;overflow:hidden}
.rc>span{display:block;transition:transform .75s var(--spring)}
.rc b{display:block;height:1.12em;font-weight:inherit}

/* AC (dark card) */
.acs{display:flex;align-items:center;gap:10px}
.acs b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em}
.acs small{display:block;font-size:12px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:#55555C}
.dot.on{background:var(--acc);animation:pulse 2.2s infinite}
.dot.err{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,91,255,.6)}70%{box-shadow:0 0 0 9px rgba(47,91,255,0)}100%{box-shadow:0 0 0 0 rgba(47,91,255,0)}}
.next{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap;transition:background .4s,color .4s}
.chip.cool{background:var(--acc);color:#fff}
.chip.off{background:rgba(255,255,255,.12);color:#fff}
.chip.hold{background:rgba(47,91,255,.22);color:#AFC0FF}
.chip.dim{opacity:.65}
.why{font-size:12.5px;color:#8B8B90}
.stepper{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.06);border-radius:18px;padding:8px;margin-top:12px}
.stepper button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:24px;font-weight:300;line-height:1;display:grid;place-items:center;transition:transform .35s var(--spring),background .2s}
.stepper button:active{transform:scale(.88);background:rgba(255,255,255,.2)}
.stepper button:disabled{opacity:.25}
.tv{text-align:center}
.tv b{display:block;font-size:38px;font-weight:300;letter-spacing:-.05em;line-height:1}
.tv small{font-size:11px;letter-spacing:.02em}
.hint{margin-top:8px;text-align:center;font-size:12px;color:var(--mut)}
.c.dk .hint{color:#8B8B90}
.hint:empty{display:none}
.seg{position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.06);padding:3px;border-radius:12px;margin-top:8px}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:#fff;transition:transform .55s var(--spring)}
.seg button{position:relative;border:0;background:none;color:#8B8B90;padding:8px 2px;font-size:12.5px;font-weight:500;white-space:nowrap;transition:color .3s}
.seg button.on{color:#141416;font-weight:600}
.ac{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:10px}
.ac button{border:0;border-radius:14px;padding:13px;font-weight:600;background:rgba(255,255,255,.1);color:#fff;transition:transform .35s var(--spring),opacity .2s}
.ac button.primary{background:var(--acc)}
.ac button:active{transform:scale(.96)}
.ac button:disabled{opacity:.45}
.auto{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:14.5px;font-weight:500}
.auto small{display:block;font-size:12px;font-weight:400}
.sw{flex:none;-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:999px;background:#3A3A40;position:relative;transition:background .3s;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .5s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sw:checked{background:var(--acc)}
.sw:checked::after{transform:translateX(20px)}

/* comfort range + rule */
details{font-size:13px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details.cfgd summary{display:flex;justify-content:space-between;align-items:center;gap:8px}
details.cfgd summary b{font-size:14px;font-weight:600}
details.cfgd summary b::after{content:"";display:inline-block;width:6px;height:6px;margin:0 2px 2px 10px;border-right:1.6px solid var(--mut);border-bottom:1.6px solid var(--mut);transform:rotate(45deg);transition:transform .4s var(--spring)}
details.cfgd[open] summary b::after{transform:rotate(-135deg);margin-bottom:-2px}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cfg label{display:grid;gap:4px;font-size:11.5px;color:var(--mut)}
.cfg input{width:100%;background:var(--tray);border:0;border-radius:10px;padding:10px;font-size:16px;color:var(--ink)}
button.save{margin-top:10px;width:100%;border:0;border-radius:12px;padding:11px;font-weight:600;background:var(--ink);color:var(--bg)}
details.how{color:var(--mut);padding:2px 6px 4px}
details.how summary{font-weight:500}
details.how summary::before{content:"+ ";font-weight:600}
details.how[open] summary::before{content:"- "}
details.how p{margin:8px 0 0;font-size:12.5px;line-height:1.5}

/* history */
.tabs{position:relative;display:flex;background:var(--tray);padding:3px;border-radius:12px;margin-bottom:12px}
.tabs i{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--card);box-shadow:var(--shc);transition:transform .55s var(--spring)}
.tabs button{position:relative;flex:1;border:0;background:none;color:var(--mut);padding:7px;font-size:13px;font-weight:500;transition:color .3s}
.tabs button.on{color:var(--ink);font-weight:600}
.chart{width:100%;display:block;touch-action:pan-y}
.chart text{fill:var(--mut);font-size:10px;font-weight:500}
.stats{font-size:11.5px;color:var(--mut)}
.tip{min-height:20px;font-size:12.5px;margin:10px 0 4px;font-weight:500}
.links{display:flex;gap:14px;font-size:12.5px;font-weight:500}.links a{color:var(--acc);text-decoration:none}

/* activity: notification-style rows */
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;box-shadow:var(--shc);padding:10px 12px}
.log li.empty{display:block;color:var(--mut);font-size:13px}
.log i{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.log i::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.log i.cool{background:var(--acc)}.log i.aon{background:var(--good)}.log i.aoff{background:var(--warm)}.log i.fail{background:var(--bad)}
.log b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.log small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log div{min-width:0}
.log time{font-size:11px;color:var(--mut);text-align:right;white-space:nowrap}
.log time small{font-size:10px}

/* settings */
.order{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.order li{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;font-size:14px;font-weight:500}
.order li span{flex:1}
.order li em{font-style:normal;font-size:12px;color:var(--mut);margin-right:2px}
.order button{width:36px;height:36px;border-radius:50%;border:0;background:var(--tray);display:grid;place-items:center;padding:0;color:var(--ink);transition:transform .35s var(--spring)}
.order button:active{transform:scale(.88)}
.order button:disabled{opacity:.25}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--tray);padding:3px;border-radius:12px}
.themes button{border:0;background:none;color:var(--mut);padding:7px;border-radius:9px;font-size:13px;font-weight:500}
.themes button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shc)}
#panel[hidden]{display:none}
#panel{animation:pop .5s var(--spring) both}

.foot{text-align:center;font-size:11.5px;color:var(--mut);margin:0}

/* staggered spring intro */
@media (prefers-reduced-motion:no-preference){
  .tray,.pin{animation:pop .7s var(--spring) both}
  .tray>*{animation:rise .6s var(--soft) both}
  .tray>*:nth-child(2){animation-delay:.06s}.tray>*:nth-child(3){animation-delay:.12s}.tray>*:nth-child(4){animation-delay:.18s}
  #cards>.tray:nth-child(2){animation-delay:.12s}
  @keyframes pop{from{opacity:0;transform:scale(.94)}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<main>
<header>
  <h1 data-i18n="h1">Oda iklimi</h1>
  <div class="hr">
    <div class="langs" id="langs"><button type="button" data-lang="tr" aria-label="Türkçe" title="Türkçe"><img src="/flags/tr.svg" alt="TR"></button><button type="button" data-lang="en" aria-label="English" title="English"><img src="/flags/gb.svg" alt="EN"></button></div>
    <span class="badge" id="badge"><i></i><span id="badgeT">...</span></span>
    <button type="button" class="gear" id="gear" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
  </div>
</header>

<section class="tray" id="panel" hidden>
  <div class="c">
    <div class="label" data-i18n="orderTitle">Kart sırası</div>
    <ul class="order" id="order"></ul>
  </div>
  <div class="c">
    <div class="label" style="margin-bottom:8px" data-i18n="themeTitle">Görünüm</div>
    <div class="themes" id="themes"><button type="button" data-th="auto" data-i18n="thAuto">Otomatik</button><button type="button" data-th="light" data-i18n="thLight">Açık</button><button type="button" data-th="dark" data-i18n="thDark">Koyu</button></div>
  </div>
</section>

<div id="cards">
<section class="tray" data-card="control">
  <div class="heroRow">
    <div class="c dialc0">
      <div class="dial">
        <svg viewBox="0 0 300 246" aria-hidden="true">
          <path id="dTrack" fill="none" stroke-width="20" stroke-linecap="round"/>
          <path id="dBand" fill="none" stroke-width="20" stroke-linecap="round"/>
          <line id="dTarget" stroke-width="4" stroke-linecap="round"/>
          <text id="dMin" text-anchor="middle"></text><text id="dMax" text-anchor="middle"></text>
          <g id="needle"><circle cx="268" cy="150" r="13"/></g>
        </svg>
        <div class="dialv"><div class="big"><span id="t">--</span><sup>°C</sup></div><div class="state" id="state" data-i18n="waiting">Ölçüm bekleniyor</div></div>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="pills">
      <div class="c pill"><small data-i18n="pHum">Nem</small><b id="h">--</b></div>
      <div class="c pill"><small data-i18n="pTrend">Eğilim · 15 dk</small><b id="trend">--</b></div>
      <div class="c pill"><small data-i18n="pSwing">Oynama · 1 sa</small><b id="swing">--</b></div>
    </div>
  </div>

  <div class="c dk">
    <div class="acs"><i class="dot" id="acdot"></i><div><b id="acline">...</b><small id="acmeta"></small></div></div>
    <div class="next"><span class="chip hold" id="chip">...</span><span class="why" id="why"></span></div>
    <div class="stepper">
      <button type="button" id="minus" aria-label="-1">&minus;</button>
      <div class="tv"><b id="tv">--</b><small data-i18n="targetLbl">hedef °C</small></div>
      <button type="button" id="plus" aria-label="+1">+</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="seg" id="fans"><i id="fanPill"></i><button type="button" data-fan="auto" data-i18n="f_auto">Oto</button><button type="button" data-fan="quiet" data-i18n="f_quiet">Sessiz</button><button type="button" data-fan="low" data-i18n="f_low">Düşük</button><button type="button" data-fan="med" data-i18n="f_med">Orta</button><button type="button" data-fan="high" data-i18n="f_high">Yüksek</button></div>
    <div class="ac"><button type="button" class="primary" id="acon">Soğutmayı aç</button><button type="button" id="acoff" data-i18n="acoff">Kapat</button></div>
    <div class="hint" id="acmsg"></div>
    <label class="auto"><span><span data-i18n="auto">Otomatik kontrol</span><small data-i18n="autoHint">Kapalıyken yalnızca öneri verir.</small></span><input class="sw" id="auto" type="checkbox"></label>
  </div>

  <div class="c">
    <details class="cfgd">
      <summary><span class="label" data-i18n="comfort">Konfor aralığı</span><b id="bandsum"></b></summary>
      <div class="cfg">
        <label><span data-i18n="tmin">Sıcaklık en düşük (°C)</span><input id="tmin" type="number" step="0.1" inputmode="decimal"></label>
        <label><span data-i18n="tmax">Sıcaklık en yüksek (°C)</span><input id="tmax" type="number" step="0.1" inputmode="decimal"></label>
        <label><span data-i18n="hmin">Nem en düşük (%)</span><input id="hmin" type="number" step="1" inputmode="numeric"></label>
        <label><span data-i18n="hmax">Nem en yüksek (%)</span><input id="hmax" type="number" step="1" inputmode="numeric"></label>
      </div>
      <button type="button" class="save" id="save" data-i18n="save">Kaydet</button>
      <div class="hint" id="cfgmsg"></div>
    </details>
  </div>
  <details class="how"><summary data-i18n="how">Kural nasıl çalışır?</summary><p id="rule"></p><p data-i18n="irNote"></p></details>
</section>

<section class="tray" data-card="history">
  <div class="c">
    <div class="tabs" id="tabs"><i id="tabPill"></i><button type="button" data-r="6s" class="on" data-i18n="r6">6 saat</button><button type="button" data-r="24s" data-i18n="r24">24 saat</button><button type="button" data-r="7g" data-i18n="r7">7 gün</button></div>
    <div class="row"><span class="label" data-i18n="tempChart">Sıcaklık</span><span class="stats" id="ts"></span></div>
    <svg class="chart" id="ct"></svg>
    <div class="row" style="margin-top:14px"><span class="label" data-i18n="humChart">Nem</span><span class="stats" id="hs"></span></div>
    <svg class="chart" id="ch"></svg>
    <div class="tip" id="tip" data-i18n="tip"></div>
    <div class="links"><a id="csv" href="#" data-i18n="csv">CSV indir</a><a id="json" href="#" data-i18n="json">JSON indir</a></div>
  </div>
  <div class="row" style="padding:4px 6px 0"><span class="label" data-i18n="logTitle">Günlük</span></div>
  <ul class="log" id="log"></ul>
</section>
</div>
<p class="foot" id="ver"></p>
<p class="foot" data-i18n="foot"></p>
</main>
<script type="module">
import { plan, describe, setpoint, roomTarget, bandFor, DEAD, FAN_LABELS } from '/policy.js';
import { I18N, LANGS } from '/i18n.js';

const $ = id => document.getElementById(id);

// ---- rolling digits (odometer, spring per column, left-to-right stagger) ----

// ---- hero ----

}

// ---- AC card ----
function renderAc() {

  $('acline').textContent = !s ? t('acUnknown') : !s.ok ? t('acFailed') : on ? t('acOn', s.target, fanName(s.fan)) : t('acOff');
  const you = s?.source === 'manual';
  $('acmeta').textContent = !s ? '' : on ? t(you ? 'byYou' : 'byAuto', when(s.at)) : t(you ? 'offYou' : 'offAuto', when(s.at));
  if (!sample) { $('chip').textContent = '...'; $('chip').className = 'chip off'; $('why').textContent = t('noReading'); }
  else {
    const p = plan(cfg, sample.temperature), T = sample.temperature;
    // What the automation does next: start cooling, nudge the running AC's setting, or leave things alone.
    const e = T - roomTarget(cfg);
    const [cls, text] = !on ? (p.action === 'cool' ? ['cool', t('chipCool', p.target, fanName(p.fan))] : ['hold', t('chipHold')])
      : e > DEAD ? ['cool', t('chipDown')] : e < -DEAD ? ['off', t('chipUp')] : ['hold', t('chipHold')];
    $('chip').className = 'chip ' + cls + (cfg.auto ? '' : ' dim');

    $('why').textContent = why + (cfg.auto ? '' : t('suggestOnly'));

  if (!want.dirty) { want.target = on ? s.target : setpoint(cfg); want.fan = on ? s.fan : 'auto'; }
  $('minus').disabled = want.target <= 18; $('plus').disabled = want.target >= 30;
  document.querySelectorAll('#fans button').forEach(b => b.classList.toggle('on', b.dataset.fan === want.fan));
  slide($('fanPill'), $('fans'));
  setRoll($('tv'), String(want.target));
  const b = bandFor(want.target);
  $('hint').textContent = want.dirty && (b.tMin !== cfg.tMin || b.tMax !== cfg.tMax) ? t('bandHint', b.tMin, b.tMax) : '';
  $('acon').textContent = on ? t('apply') : t('acon');

  $('acmsg').textContent = acMsg ? t(acMsg) : '';

// ---- charts ----
const el = (name, attrs, text) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };

}

const geo = {};

function charts() {
  chart($('ct'), $('ts'), 'temperature', cssv('--acc'), '°', [cfg.tMin, cfg.tMax], 190, true);

// ---- activity ----
function renderLog() {
  const runs = [];
  for (const l of logRows) {
    const key = [l.action, l.target, l.fan, l.ok].join('|'), last = runs[runs.length - 1];
    if (last && last.key === key) { last.n++; continue; }
    runs.push({ key, n: 1, ...l });
  }
  const ul = $('log'); ul.replaceChildren();
  if (!runs.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = t('logEmpty'); ul.append(li); return; }
  for (const r of runs.reverse().slice(0, 6)) {
    const li = document.createElement('li'), time = document.createElement('time'), dot = document.createElement('i'), box = document.createElement('div'), b = document.createElement('b'), sm = document.createElement('small');
    time.textContent = hm.format(r.at);
    if (dm.format(r.at) !== dm.format(Date.now())) { const d = document.createElement('small'); d.textContent = dm.format(r.at); time.append(d); }
    dot.className = !r.ok ? 'fail' : r.action === 'cool' ? 'cool' : r.action === 'auto_on' ? 'aon' : r.action === 'auto_off' ? 'aoff' : '';
    b.textContent = r.action === 'cool' ? t('logCool', r.target, fanName(r.fan)) : r.action === 'off' ? t('logOff') : r.action === 'auto_on' ? t('logAutoOn') : t('logAutoOff');
    const bits = [r.source === 'auto' ? t('whoAuto') : t('whoYou')];
    if (Number.isFinite(r.temperature)) bits.push(t('logRoom', r.temperature.toFixed(1)));
    if (r.n > 1) bits.push(t('logAgain', r.n - 1));
    if (!r.ok) bits.push(t('logFail'));
    sm.textContent = bits.join(' · ');
    box.append(b, sm); li.append(dot, box, time); ul.append(li);
  }
}

// ---- settings ----

  if (fill) { $('tmin').value = cfg.tMin; $('tmax').value = cfg.tMax; $('hmin').value = cfg.hMin; $('hmax').value = cfg.hMax; }

// ---- data ----
async function api(path, opts) {
  const r = await fetch(path, { cache: 'no-store', ...opts });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const post = (path, body, method = 'POST') => api(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function loadState() {
  try {
    const d = await api('/api/state');
    const bandMoved = d.profile && (d.profile.tMin !== cfg.tMin || d.profile.tMax !== cfg.tMax || d.profile.hMin !== cfg.hMin || d.profile.hMax !== cfg.hMax);
    sample = d.sample; hour = d.hour; before = d.before; acState = d.state; ver = { version: d.version, build: d.build };
    if (d.profile) cfg = { ...cfg, ...d.profile };
    renderAll();
    if (bandMoved || !cfgLoaded) { cfgLoaded = true; renderCfg(true); }
    charts(); // the band or the live point may have moved
  } catch { renderAll(); }
}
async function loadHistory() {
  try { const d = await api('/api/sensor?range=' + range); pts = d.samples || []; logRows = d.log || []; histAt = Date.now(); } catch { /* keep the last data */ }
  charts(); renderLog();
  $('csv').href = '/api/sensor?range=' + range + '&format=csv';
  $('json').href = '/api/sensor?range=' + range + '&format=json';
}
// The reading refreshes every minute; history only as often as its buckets change (5 min, or 30 min for 7 days).
function tick() {
  loadState();
  if (Date.now() - histAt > (range === '7g' ? 30 : 5) * 60000) loadHistory();
}

// ---- actions ----
async function ac(action) {
  if (busy) return;
  busy = true; acMsg = 'sending'; renderAc();
  try {
    await post('/api/ac', action === 'cool' ? { action, target: want.target, fan: want.fan } : { action });
    want.dirty = false; acMsg = 'sent';
  } catch { acMsg = 'sendFail'; }
  busy = false;
  await loadState(); loadHistory();
  setTimeout(() => { if (acMsg === 'sent') { acMsg = null; renderAc(); } }, 4000);
}
$('acon').onclick = () => ac('cool');
$('acoff').onclick = () => ac('off');
function step(d) { want.target = Math.min(30, Math.max(18, want.target + d)); want.dirty = true; acMsg = null; renderAc(); }
$('minus').onclick = () => step(-1);
$('plus').onclick = () => step(1);
$('fans').onclick = e => { const b = e.target.closest('button'); if (!b) return; want.fan = b.dataset.fan; want.dirty = true; acMsg = null; renderAc(); };
$('auto').onchange = async () => {
  const auto = $('auto').checked;
  try { await post('/api/ac', { auto }); cfg.auto = auto; acMsg = null; } catch { acMsg = 'autoFail'; }
  renderAc(); loadHistory();
};
$('save').onclick = async () => {
  const next = { ...cfg, tMin: +$('tmin').value, tMax: +$('tmax').value, hMin: +$('hmin').value, hMax: +$('hmax').value };
  if (![next.tMin, next.tMax, next.hMin, next.hMax].every(Number.isFinite) || next.tMin >= next.tMax || next.hMin >= next.hMax) { cfgMsg = 'cfgInvalid'; renderCfg(false); return; }
  try { await post('/api/profile', next, 'PUT'); cfg = next; cfgMsg = 'saved'; } catch { cfgMsg = 'saveFail'; }
  renderAll(); charts();
};
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  range = b.dataset.r;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  slide($('tabPill'), $('tabs'));
  loadHistory();
};
for (const id of ['ct', 'ch']) { $(id).addEventListener('pointermove', tipAt); $(id).addEventListener('pointerdown', tipAt); }
window.addEventListener('resize', () => { charts(); slide($('tabPill'), $('tabs')); slide($('fanPill'), $('fans')); });

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  $('gear').setAttribute('aria-label', t('settings')); $('gear').title = t('settings');
  setLocale();
  renderAll(); charts(); renderLog(); applyOrder();
  requestAnimationFrame(() => { slide($('tabPill'), $('tabs')); slide($('fanPill'), $('fans')); });
}
$('langs').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch { /* storage may be blocked */ }
  applyLang();
};

lang = pickLang();
applyLang();
loadState(); loadHistory();
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
