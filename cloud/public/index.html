<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oda iklimi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root{--bg:#070b18;--text:#f4f7fb;--muted:#93a4bf;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--well:rgba(0,0,0,.24);--acc:#34d399;--ok:#34d399;--warm:#fb923c;--blue:#38bdf8;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(80px)}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-28vmax;top:-30vmax;background:#4c1d95;opacity:.6}
.bg i:nth-child(2){width:56vmax;height:56vmax;right:-24vmax;top:26vh;background:#075985;opacity:.6}
.bg i:nth-child(3){width:52vmax;height:52vmax;left:10vw;top:-14vmax;background:var(--acc);opacity:.2;transition:background 1.5s}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));display:grid;gap:12px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:18px;-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%)}
header{display:flex;justify-content:space-between;align-items:center;padding:2px 6px}
h1{margin:0;font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.hr{display:flex;align-items:center;gap:10px}
.langs{display:flex;gap:6px}
.langs button{border:2px solid transparent;background:none;padding:0;border-radius:6px;line-height:0;opacity:.5}
.langs button.on{opacity:1;border-color:rgba(255,255,255,.7)}
.langs img{width:26px;height:18px;border-radius:3px;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--ok)}.badge.bad{color:var(--bad)}
.label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta{font-size:12.5px;color:var(--muted)}

/* hero */
.hero{padding:14px 18px 16px}
.dial{position:relative;max-width:330px;margin:0 auto}
.dial svg{display:block;width:100%;height:auto;overflow:visible}
.dial text{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#needle{transform:rotate(135deg);transform-origin:150px 150px;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
#needle circle{fill:var(--acc);stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 8px var(--acc));transition:fill 1s}
.dialc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:16%;text-align:center;pointer-events:none}
.big{font-size:clamp(58px,19vw,76px);font-weight:200;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums;position:relative}
.big sup{position:absolute;left:100%;top:.2em;font-size:.24em;letter-spacing:0;color:var(--muted);font-weight:400;margin-left:3px}
.state{margin-top:8px;font-size:15px;font-weight:500;color:var(--acc);transition:color 1s}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.pill{background:var(--well);border-radius:16px;padding:10px 6px;text-align:center;min-width:0}
.pill small{display:block;font-size:10.5px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill b{display:block;margin-top:2px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.hero .meta{text-align:center;margin-top:10px}

/* AC card */
.acs{display:flex;align-items:center;gap:10px;min-width:0}
.acs b{display:block;font-size:16px;font-weight:600}
.acs small{display:block;font-size:12.5px;color:var(--muted)}
.dot{flex:none;width:11px;height:11px;border-radius:50%;background:#64748b}
.dot.on{background:var(--blue);animation:pulse 2.2s infinite}
.dot.err{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,189,248,.55)}70%{box-shadow:0 0 0 9px rgba(56,189,248,0)}100%{box-shadow:0 0 0 0 rgba(56,189,248,0)}}
.chip{flex:none;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.chip.cool{background:rgba(56,189,248,.16);color:#7dd3fc;border-color:rgba(56,189,248,.4)}
.chip.off{background:rgba(148,163,184,.16);color:#cbd5e1;border-color:rgba(148,163,184,.35)}
.chip.hold{background:rgba(52,211,153,.14);color:#6ee7b7;border-color:rgba(52,211,153,.35)}
.chip.dim{opacity:.7;border-style:dashed}
.next{display:flex;align-items:center;gap:10px;margin-top:12px}
.why{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--well);border-radius:22px;padding:8px;margin-top:14px}
.stepper button{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:28px;font-weight:300;line-height:1;display:grid;place-items:center}
.stepper button:active{background:rgba(255,255,255,.2)}
.stepper button:disabled{opacity:.3}
.tv{text-align:center}
.tv b{display:block;font-size:40px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.tv small{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.hint{margin-top:8px;text-align:center;font-size:12.5px;color:var(--muted)}
.hint:empty{display:none}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--well);padding:4px;border-radius:14px;margin-top:8px}
.seg button{border:0;background:none;color:var(--muted);padding:9px 2px;border-radius:10px;font-size:13px;white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.16);color:var(--text);font-weight:600}
.ac{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-top:12px}
.ac button{border:1px solid var(--line);background:rgba(255,255,255,.09);border-radius:16px;padding:13px;font-weight:600}
.ac button.primary{border:0;color:#06121f;background:linear-gradient(135deg,#7dd3fc,#a5b4fc)}
.ac button:active{transform:scale(.98)}
.ac button:disabled{opacity:.5}
.auto{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
.auto small{display:block;font-size:12.5px;color:var(--muted)}
.sw{flex:none;-webkit-appearance:none;appearance:none;width:52px;height:32px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw:checked{background:var(--ok)}
.sw:checked::after{transform:translateX(20px)}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details.how{margin-top:12px}
details.how summary::before{content:"+ ";font-weight:600}
details.how[open] summary::before{content:"- "}
details.how p{margin:8px 0 0}

/* charts */
.tabs{display:flex;gap:4px;background:var(--well);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px;border-radius:10px;font-size:14px}
.tabs button.on{background:rgba(255,255,255,.16);color:var(--text);font-weight:600}
.chart{width:100%;display:block;touch-action:pan-y}
.chart text{fill:#93a4bf;font-size:10px;font-variant-numeric:tabular-nums}
.stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tip{min-height:20px;font-size:13px;margin:10px 0 6px}
.links{display:flex;gap:14px;font-size:13px}.links a{color:var(--blue);text-decoration:none}

/* activity */
.log{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.log li{display:grid;grid-template-columns:44px 12px 1fr;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.log li:first-child{border-top:0}
.log time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.log time small{display:block;font-size:10.5px;opacity:.8}
.log i{width:9px;height:9px;border-radius:50%;background:#64748b;align-self:center}
.log i.cool{background:var(--blue)}.log i.aon{background:var(--ok)}.log i.aoff{background:var(--warm)}.log i.fail{background:var(--bad)}
.log b{display:block;font-size:14px;font-weight:500}
.log small{display:block;font-size:12px;color:var(--muted)}

/* settings */
details.cfgd summary{display:flex;justify-content:space-between;align-items:center}
details.cfgd summary b{color:var(--text);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cfg label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.cfg input{width:100%;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px}
button.save{margin-top:12px;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:600;background:rgba(255,255,255,.1)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:0}
@media(prefers-reduced-motion:no-preference){
  .bg i{animation:drift 26s ease-in-out infinite alternate}.bg i:nth-child(2){animation-duration:32s}.bg i:nth-child(3){animation-duration:38s}
  @keyframes drift{to{transform:translate(6vmax,4vmax)}}
  .card{animation:rise .5s ease both}.card:nth-of-type(2){animation-delay:.05s}.card:nth-of-type(3){animation-delay:.1s}.card:nth-of-type(4){animation-delay:.15s}.card:nth-of-type(5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
}
@media(prefers-reduced-motion:reduce){#needle{transition:none}.dot.on{animation:none}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<main>
<header>
  <h1 data-i18n="h1">ODA İKLİMİ</h1>
  <div class="hr">
    <div class="langs" id="langs"><button type="button" data-lang="tr" aria-label="Türkçe" title="Türkçe"><img src="/flags/tr.svg" alt="TR"></button><button type="button" data-lang="en" aria-label="English" title="English"><img src="/flags/gb.svg" alt="EN"></button></div>
    <span class="badge" id="badge"><i></i><span id="badgeT">...</span></span>
  </div>
</header>

<section class="card hero">
  <div class="dial">
    <svg viewBox="0 0 300 246" aria-hidden="true">
      <path id="dTrack" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="14" stroke-linecap="round"/>
      <path id="dBand" fill="none" stroke="var(--ok)" stroke-width="14" stroke-linecap="round" opacity=".85"/>
      <line id="dTarget" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
      <text id="dMin" text-anchor="middle"></text><text id="dMax" text-anchor="middle"></text>
      <g id="needle"><circle cx="268" cy="150" r="11"/></g>
    </svg>
    <div class="dialc">
      <div class="big"><span id="t">--</span><sup>°C</sup></div>
      <div class="state" id="state" data-i18n="waiting">Ölçüm bekleniyor</div>
    </div>
  </div>
  <div class="pills">
    <div class="pill"><small data-i18n="pHum">Nem</small><b id="h">--</b></div>
    <div class="pill"><small data-i18n="pTrend">Eğilim · 15 dk</small><b id="trend">--</b></div>
    <div class="pill"><small data-i18n="pSwing">Oynama · 1 sa</small><b id="swing">--</b></div>
  </div>
  <div class="meta" id="meta"></div>
</section>

<section class="card">
  <div class="acs"><i class="dot" id="acdot"></i><div><b id="acline">...</b><small id="acmeta"></small></div></div>
  <div class="next"><span class="chip hold" id="chip">...</span><span class="why" id="why"></span></div>
  <div class="stepper">
    <button type="button" id="minus" aria-label="-1">&minus;</button>
    <div class="tv"><b id="tv">--</b><small data-i18n="targetLbl">hedef °C</small></div>
    <button type="button" id="plus" aria-label="+1">+</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="seg" id="fans">
    <button type="button" data-fan="auto" data-i18n="f_auto">Oto</button><button type="button" data-fan="quiet" data-i18n="f_quiet">Sessiz</button><button type="button" data-fan="low" data-i18n="f_low">Düşük</button><button type="button" data-fan="med" data-i18n="f_med">Orta</button><button type="button" data-fan="high" data-i18n="f_high">Yüksek</button>
  </div>
  <div class="ac"><button type="button" class="primary" id="acon">Soğutmayı aç</button><button type="button" id="acoff" data-i18n="acoff">Kapat</button></div>
  <div class="hint" id="acmsg"></div>
  <label class="auto"><span><span data-i18n="auto">Otomatik kontrol</span><small data-i18n="autoHint">Kapalıyken yalnızca öneri verir.</small></span><input class="sw" id="auto" type="checkbox"></label>
  <details class="how"><summary data-i18n="how">Kural nasıl çalışır?</summary><p id="rule"></p><p data-i18n="irNote"></p></details>
</section>

<section class="card">
  <div class="tabs" id="tabs"><button type="button" data-r="6s" class="on" data-i18n="r6">6 saat</button><button type="button" data-r="24s" data-i18n="r24">24 saat</button><button type="button" data-r="7g" data-i18n="r7">7 gün</button></div>
  <div class="row"><span class="label" data-i18n="tempChart">Sıcaklık</span><span class="stats" id="ts"></span></div>
  <svg class="chart" id="ct"></svg>
  <div class="row" style="margin-top:14px"><span class="label" data-i18n="humChart">Nem</span><span class="stats" id="hs"></span></div>
  <svg class="chart" id="ch"></svg>
  <div class="tip" id="tip" data-i18n="tip"></div>
  <div class="links"><a id="csv" href="#" data-i18n="csv">CSV indir</a><a id="json" href="#" data-i18n="json">JSON indir</a></div>
</section>

<section class="card">
  <div class="label" data-i18n="logTitle">Günlük</div>
  <ul class="log" id="log"></ul>
</section>

<section class="card">
  <details class="cfgd">
    <summary><span class="label" data-i18n="comfort">Konfor aralığı</span><b id="bandsum"></b></summary>
    <div class="cfg">
      <label><span data-i18n="tmin">Sıcaklık en düşük (°C)</span><input id="tmin" type="number" step="0.1" inputmode="decimal"></label>
      <label><span data-i18n="tmax">Sıcaklık en yüksek (°C)</span><input id="tmax" type="number" step="0.1" inputmode="decimal"></label>
      <label><span data-i18n="hmin">Nem en düşük (%)</span><input id="hmin" type="number" step="1" inputmode="numeric"></label>
      <label><span data-i18n="hmax">Nem en yüksek (%)</span><input id="hmax" type="number" step="1" inputmode="numeric"></label>
    </div>
    <button type="button" class="save" id="save" data-i18n="save">Kaydet</button>
    <div class="hint" id="cfgmsg"></div>
  </details>
</section>
<p class="foot" id="ver"></p>
<p class="foot" data-i18n="foot"></p>
</main>
<script type="module">
import { plan, describe, setpoint, roomTarget, bandFor, DEAD, FAN_LABELS } from '/policy.js';
import { I18N, LANGS } from '/i18n.js';

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const LOCALE = { tr: 'tr-TR', en: 'en-GB' };
const COLORS = { ok: '#34d399', warm: '#fb923c', cool: '#38bdf8' };

// ---- state ----
let lang = 'tr', range = '6s';
let cfg = { tMin: 23, tMax: 26, hMin: 40, hMax: 60, auto: false };
let sample = null, hour = null, before = null, acState = null, ver = null;
let pts = [], logRows = [], histAt = 0;
let want = { target: null, fan: 'auto', dirty: false }; // what the stepper and fan buttons show
let acMsg = null, cfgMsg = null, busy = false, cfgLoaded = false;
let clock, hm, dm;

// ---- i18n ----
const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const pct = n => (lang === 'tr' ? '%' + n : n + '%');
const fanName = f => FAN_LABELS[lang][f] || f;
function setLocale() {
  const o = { timeZone: 'Asia/Singapore' };
  clock = new Intl.DateTimeFormat(LOCALE[lang], { ...o, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  hm = new Intl.DateTimeFormat(LOCALE[lang], { ...o, hour: '2-digit', minute: '2-digit' });
  dm = new Intl.DateTimeFormat(LOCALE[lang], { ...o, day: '2-digit', month: '2-digit' });
}
function pickLang() {
  try { const s = localStorage.getItem('lang'); if (LANGS.includes(s)) return s; } catch { /* storage may be blocked */ }
  return /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en';
}
const when = at => (dm.format(at) === dm.format(Date.now()) ? hm.format(at) : clock.format(at));
const num = v => String(+(+v).toFixed(1));

// ---- hero ----
const CX = 150, CY = 150, RAD = 118, A0 = 135, SWEEP = 270;
const polar = (a, r = RAD) => [CX + r * Math.cos(a * Math.PI / 180), CY + r * Math.sin(a * Math.PI / 180)];
function arc(a, b) {
  const [x0, y0] = polar(a), [x1, y1] = polar(b);
  return `M${x0.toFixed(1)},${y0.toFixed(1)}A${RAD},${RAD} 0 ${b - a > 180 ? 1 : 0} 1 ${x1.toFixed(1)},${y1.toFixed(1)}`;
}
function renderHero() {
  const lo = cfg.tMin - 2, hi = cfg.tMax + 2;
  const ang = v => A0 + SWEEP * Math.min(1, Math.max(0, (v - lo) / (hi - lo)));
  $('dTrack').setAttribute('d', arc(A0, A0 + SWEEP));
  $('dBand').setAttribute('d', arc(ang(cfg.tMin), ang(cfg.tMax)));
  const ta = ang(roomTarget(cfg)), [tx0, ty0] = polar(ta, RAD - 11), [tx1, ty1] = polar(ta, RAD + 11);
  for (const [k, v] of [['x1', tx0], ['y1', ty0], ['x2', tx1], ['y2', ty1]]) $('dTarget').setAttribute(k, v.toFixed(1));
  for (const [id, v] of [['dMin', cfg.tMin], ['dMax', cfg.tMax]]) {
    const [x, y] = polar(ang(v), RAD + 24);
    $(id).setAttribute('x', x.toFixed(1)); $(id).setAttribute('y', (y + 4).toFixed(1)); $(id).textContent = num(v) + '°';
  }
  const fresh = sample && Date.now() - sample.at < 180000;
  $('badgeT').textContent = !sample ? t('noData') : fresh ? t('live') : t('stale');
  $('badge').className = 'badge ' + (!sample ? '' : fresh ? 'ok' : 'bad');
  if (!sample) { $('state').textContent = t('waiting'); return; }
  const T = sample.temperature, kind = T > cfg.tMax ? 'warm' : T < cfg.tMin ? 'cool' : 'ok';
  document.documentElement.style.setProperty('--acc', COLORS[kind]);
  $('needle').style.transform = `rotate(${ang(T)}deg)`;
  $('t').textContent = T.toFixed(1);
  const parts = [];
  if (kind === 'cool') parts.push(t('cool')); else if (kind === 'warm') parts.push(t('hot'));
  if (sample.humidity < cfg.hMin) parts.push(t('dry')); else if (sample.humidity > cfg.hMax) parts.push(t('humid'));
  $('state').textContent = parts.length ? t('roomIs', parts.join(t('and'))) : t('inBand');
  $('h').textContent = pct(Math.round(sample.humidity));
  $('h').style.color = sample.humidity < cfg.hMin || sample.humidity > cfg.hMax ? COLORS.warm : '';
  if (before == null || !fresh) $('trend').textContent = '--';
  else { const d = T - before; $('trend').textContent = Math.abs(d) < 0.15 ? '→ ' + t('steady') : (d > 0 ? '↗ +' : '↘ -') + Math.abs(d).toFixed(1) + '°'; }
  if (!hour) { $('swing').textContent = '--'; $('swing').style.color = ''; }
  else { const s = hour.max - hour.min; $('swing').textContent = s.toFixed(1) + '°'; $('swing').style.color = s <= 0.5 ? COLORS.ok : s > 1 ? COLORS.warm : ''; }
  $('meta').textContent = t('lastReading') + clock.format(sample.at) + (fresh ? '' : t('staleSuffix'));
}

// ---- AC card ----
function renderAc() {
  const s = acState, on = s?.power === 'on';
  $('acdot').className = 'dot' + (s && !s.ok ? ' err' : on ? ' on' : '');
  $('acline').textContent = !s ? t('acUnknown') : !s.ok ? t('acFailed') : on ? t('acOn', s.target, fanName(s.fan)) : t('acOff');
  const you = s?.source === 'manual';
  $('acmeta').textContent = !s ? '' : on ? t(you ? 'byYou' : 'byAuto', when(s.at)) : t(you ? 'offYou' : 'offAuto', when(s.at));
  if (!sample) { $('chip').textContent = '...'; $('chip').className = 'chip off'; $('why').textContent = t('noReading'); }
  else {
    const p = plan(cfg, sample.temperature), T = sample.temperature;
    // What the automation does next: start cooling, nudge the running AC's setting, or leave things alone.
    const e = T - roomTarget(cfg);
    const [cls, text] = !on ? (p.action === 'cool' ? ['cool', t('chipCool', p.target, fanName(p.fan))] : ['hold', t('chipHold')])
      : e > DEAD ? ['cool', t('chipDown')] : e < -DEAD ? ['off', t('chipUp')] : ['hold', t('chipHold')];
    $('chip').className = 'chip ' + cls + (cfg.auto ? '' : ' dim');
    $('chip').textContent = text;
    const why = p.action === 'cool' ? t('whyOver', p.over.toFixed(1)) : p.action === 'off' ? t('whyUnder', (cfg.tMin - T).toFixed(1)) : t('whyIn');
    $('why').textContent = why + (cfg.auto ? '' : t('suggestOnly'));
  }
  if (!want.dirty) { want.target = on ? s.target : setpoint(cfg); want.fan = on ? s.fan : 'auto'; }
  $('tv').textContent = want.target;
  $('minus').disabled = want.target <= 18; $('plus').disabled = want.target >= 30;
  document.querySelectorAll('#fans button').forEach(b => b.classList.toggle('on', b.dataset.fan === want.fan));
  const b = bandFor(want.target);
  $('hint').textContent = want.dirty && (b.tMin !== cfg.tMin || b.tMax !== cfg.tMax) ? t('bandHint', b.tMin, b.tMax) : '';
  $('acon').textContent = on ? t('apply') : t('acon');
  $('acon').disabled = $('acoff').disabled = busy;
  $('acmsg').textContent = acMsg ? t(acMsg) : '';
  $('auto').checked = cfg.auto === true;
  $('rule').textContent = describe(cfg, lang);
}

// ---- charts ----
const el = (name, attrs, text) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
function nice(lo, hi, n) {
  const raw = (hi - lo || 1) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
// Monotone cubic through the points: smooth, and never overshoots a peak or dip.
function curve(P) {
  const n = P.length, f = v => v.toFixed(1);
  if (n < 3) return 'M' + P.map(p => f(p[0]) + ',' + f(p[1])).join('L');
  const dx = [], m = [], tg = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = P[i + 1][0] - P[i][0]; m[i] = (P[i + 1][1] - P[i][1]) / (dx[i] || 1); }
  tg[0] = m[0]; tg[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) tg[i] = m[i - 1] * m[i] <= 0 ? 0 : 2 * m[i - 1] * m[i] / (m[i - 1] + m[i]);
  let d = `M${f(P[0][0])},${f(P[0][1])}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += `C${f(P[i][0] + h)},${f(P[i][1] + h * tg[i])} ${f(P[i + 1][0] - h)},${f(P[i + 1][1] - h * tg[i + 1])} ${f(P[i + 1][0])},${f(P[i + 1][1])}`; }
  return d;
}
// History plus the live reading, so the right edge of the line is always current.
function series() {
  if (sample && pts.length && sample.at > pts[pts.length - 1].at) return [...pts, sample];
  return pts;
}
const acEvents = () => logRows.filter(l => l.ok && (l.action === 'cool' || l.action === 'off'));
function acAt(at) { let cur = null; for (const e of acEvents()) { if (e.at > at) break; cur = e; } return cur; }
function laneSegs(x0, x1) {
  const segs = []; let cur = null;
  for (const e of acEvents()) {
    const key = e.action === 'off' ? 'off' : e.target;
    if (cur && cur.key === key) continue;
    if (cur) cur.to = e.at;
    cur = { key, from: e.at, to: x1 }; segs.push(cur);
  }
  return segs.filter(s => s.to > x0 && s.from < x1).map(s => ({ key: s.key, from: Math.max(s.from, x0), to: Math.min(s.to, x1) }));
}
const geo = {};
function chart(svg, statEl, key, color, unit, band, H, lane) {
  svg.replaceChildren(); svg.style.height = H + 'px';
  const data = series();
  if (data.length < 2) { statEl.textContent = ''; delete geo[key]; return; }
  const W = svg.clientWidth || 340, L = 36, R = 8, T = 8, B = 20, PB = H - B - (lane ? 18 : 0);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const xs = data.map(p => p.at), ys = data.map(p => p[key]);
  const x0 = xs[0], x1 = xs[xs.length - 1], lo = Math.min(...ys), hi = Math.max(...ys);
  const bLo = Math.min(lo, band[0]), bHi = Math.max(hi, band[1]), pad = (bHi - bLo || 1) * .12;
  const y0 = bLo - pad, y1 = bHi + pad;
  const X = v => L + (v - x0) / (x1 - x0 || 1) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (PB - T);
  geo[key] = { X, L, R, W, x0, x1 };
  const defs = el('defs', {}), grad = el('linearGradient', { id: 'f' + key, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.append(el('stop', { offset: 0, 'stop-color': color, 'stop-opacity': .35 }), el('stop', { offset: 1, 'stop-color': color, 'stop-opacity': 0 }));
  defs.append(grad); svg.append(defs);
  for (const v of nice(y0, y1, 4)) {
    svg.append(el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: 'rgba(255,255,255,.08)' }));
    svg.append(el('text', { x: L - 6, y: Y(v) + 3, 'text-anchor': 'end' }, (Math.round(v * 10) / 10) + unit));
  }
  const fmtX = range === '7g' ? v => dm.format(v) : v => hm.format(v);
  for (let i = 0; i <= 4; i++) {
    const v = x0 + (x1 - x0) * i / 4;
    svg.append(el('text', { x: X(v), y: H - 5, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle' }, fmtX(v)));
  }
  svg.append(el('rect', { x: L, y: Y(band[1]), width: W - L - R, height: Math.max(0, Y(band[0]) - Y(band[1])), fill: 'rgba(52,211,153,.12)', rx: 3 }));
  for (const b of band) svg.append(el('line', { x1: L, x2: W - R, y1: Y(b), y2: Y(b), stroke: '#34d399', 'stroke-opacity': .7, 'stroke-dasharray': '4 4' }));
  const d = curve(data.map(p => [X(p.at), Y(p[key])]));
  svg.append(el('path', { d: `${d}L${X(x1).toFixed(1)},${PB}L${X(x0).toFixed(1)},${PB}Z`, fill: `url(#f${key})` }));
  svg.append(el('path', { d, fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  const last = data[data.length - 1];
  svg.append(el('circle', { cx: X(last.at), cy: Y(last[key]), r: 4, fill: color, stroke: '#fff', 'stroke-width': 1.5 }));
  if (lane) {
    const ly = PB + 6, lh = 9;
    svg.append(el('text', { x: L - 6, y: ly + 8, 'text-anchor': 'end' }, t('laneLbl')));
    svg.append(el('rect', { x: L, y: ly, width: W - L - R, height: lh, rx: 4.5, fill: 'rgba(255,255,255,.07)' }));
    for (const s of laneSegs(x0, x1)) {
      if (s.key === 'off') continue;
      const sx = X(s.from), w = Math.max(2, X(s.to) - sx);
      // a cooler setting is drawn in a deeper blue
      svg.append(el('rect', { x: sx, y: ly, width: w, height: lh, rx: 4.5, fill: '#38bdf8', 'fill-opacity': Math.min(1, Math.max(.35, .95 - (s.key - 22) * .1)) }));
      if (w > 20) svg.append(el('text', { x: sx + w / 2, y: ly + 7.6, 'text-anchor': 'middle', style: 'fill:#06121f;font-size:8.5px;font-weight:700' }, s.key + '°'));
    }
  }
  svg.append(el('line', { id: 'm' + key, y1: T, y2: PB, stroke: '#fff', 'stroke-opacity': .5, visibility: 'hidden' }));
  svg.append(el('circle', { id: 'p' + key, r: 4.5, fill: '#fff', visibility: 'hidden' }));
  geo[key].Y = Y;
  const avg = ys.reduce((a, b) => a + b, 0) / ys.length, [sa, sb, sc] = t('stat');
  statEl.textContent = `${sa} ${lo.toFixed(1)} · ${sb} ${avg.toFixed(1)} · ${sc} ${hi.toFixed(1)}${unit}`;
}
function charts() {
  chart($('ct'), $('ts'), 'temperature', '#fb923c', '°', [cfg.tMin, cfg.tMax], 196, true);
  chart($('ch'), $('hs'), 'humidity', '#38bdf8', '%', [cfg.hMin, cfg.hMax], 128, false);
}
function tipAt(e) {
  const data = series(), svg = e.currentTarget, g = geo[svg.id === 'ct' ? 'temperature' : 'humidity'];
  if (!data.length || !g) return;
  const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * g.W;
  const at = g.x0 + Math.min(1, Math.max(0, (px - g.L) / (g.W - g.L - g.R))) * (g.x1 - g.x0);
  const p = data.reduce((a, b) => (Math.abs(b.at - at) < Math.abs(a.at - at) ? b : a));
  const ac = acAt(p.at);
  $('tip').textContent = clock.format(p.at) + ' · ' + p.temperature.toFixed(1) + ' °C · ' + pct(Math.round(p.humidity)) + (!ac ? '' : ac.action === 'off' ? t('tipOff') : t('tipAc', ac.target));
  for (const k of ['temperature', 'humidity']) {
    const m = $('m' + k), d = $('p' + k), q = geo[k];
    if (!m || !q) continue;
    m.setAttribute('x1', q.X(p.at)); m.setAttribute('x2', q.X(p.at)); m.setAttribute('visibility', 'visible');
    d.setAttribute('cx', q.X(p.at)); d.setAttribute('cy', q.Y(p[k])); d.setAttribute('visibility', 'visible');
  }
}

// ---- activity ----
function renderLog() {
  const runs = [];
  for (const l of logRows) {
    const key = [l.action, l.target, l.fan, l.ok].join('|'), last = runs[runs.length - 1];
    if (last && last.key === key) { last.n++; continue; }
    runs.push({ key, n: 1, ...l });
  }
  const ul = $('log'); ul.replaceChildren();
  if (!runs.length) { const li = document.createElement('li'); li.style.display = 'block'; li.className = 'meta'; li.textContent = t('logEmpty'); ul.append(li); return; }
  for (const r of runs.reverse().slice(0, 8)) {
    const li = document.createElement('li'), time = document.createElement('time'), dot = document.createElement('i'), box = document.createElement('div'), b = document.createElement('b'), sm = document.createElement('small');
    time.textContent = hm.format(r.at);
    if (dm.format(r.at) !== dm.format(Date.now())) { const d = document.createElement('small'); d.textContent = dm.format(r.at); time.append(d); }
    dot.className = !r.ok ? 'fail' : r.action === 'cool' ? 'cool' : r.action === 'auto_on' ? 'aon' : r.action === 'auto_off' ? 'aoff' : '';
    b.textContent = r.action === 'cool' ? t('logCool', r.target, fanName(r.fan)) : r.action === 'off' ? t('logOff') : r.action === 'auto_on' ? t('logAutoOn') : t('logAutoOff');
    const bits = [r.source === 'auto' ? t('whoAuto') : t('whoYou')];
    if (Number.isFinite(r.temperature)) bits.push(t('logRoom', r.temperature.toFixed(1)));
    if (r.n > 1) bits.push(t('logAgain', r.n - 1));
    if (!r.ok) bits.push(t('logFail'));
    sm.textContent = bits.join(' · ');
    box.append(b, sm); li.append(time, dot, box); ul.append(li);
  }
}

// ---- settings ----
function renderCfg(fill) {
  $('bandsum').textContent = `${num(cfg.tMin)}° - ${num(cfg.tMax)}° · ${pct(cfg.hMin)} - ${pct(cfg.hMax)}`;
  if (fill) { $('tmin').value = cfg.tMin; $('tmax').value = cfg.tMax; $('hmin').value = cfg.hMin; $('hmax').value = cfg.hMax; }
  $('cfgmsg').textContent = cfgMsg ? t(cfgMsg) : '';
}
function renderVer() { $('ver').textContent = ver ? `${t('version')} ${ver.version} · ${ver.build}` : ''; }
function renderAll() { renderHero(); renderAc(); renderCfg(false); renderVer(); }

// ---- data ----
async function api(path, opts) {
  const r = await fetch(path, { cache: 'no-store', ...opts });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const post = (path, body, method = 'POST') => api(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function loadState() {
  try {
    const d = await api('/api/state');
    const bandMoved = d.profile && (d.profile.tMin !== cfg.tMin || d.profile.tMax !== cfg.tMax || d.profile.hMin !== cfg.hMin || d.profile.hMax !== cfg.hMax);
    sample = d.sample; hour = d.hour; before = d.before; acState = d.state; ver = { version: d.version, build: d.build };
    if (d.profile) cfg = { ...cfg, ...d.profile };
    renderAll();
    if (bandMoved || !cfgLoaded) { cfgLoaded = true; renderCfg(true); }
    charts(); // the band or the live point may have moved
  } catch { renderAll(); }
}
async function loadHistory() {
  try { const d = await api('/api/sensor?range=' + range); pts = d.samples || []; logRows = d.log || []; histAt = Date.now(); } catch { /* keep the last data */ }
  charts(); renderLog();
  $('csv').href = '/api/sensor?range=' + range + '&format=csv';
  $('json').href = '/api/sensor?range=' + range + '&format=json';
}
// The reading refreshes every minute; history only as often as its buckets change (5 min, or 30 min for 7 days).
function tick() {
  loadState();
  if (Date.now() - histAt > (range === '7g' ? 30 : 5) * 60000) loadHistory();
}

// ---- actions ----
async function ac(action) {
  if (busy) return;
  busy = true; acMsg = 'sending'; renderAc();
  try {
    await post('/api/ac', action === 'cool' ? { action, target: want.target, fan: want.fan } : { action });
    want.dirty = false; acMsg = 'sent';
  } catch { acMsg = 'sendFail'; }
  busy = false;
  await loadState(); loadHistory();
  setTimeout(() => { if (acMsg === 'sent') { acMsg = null; renderAc(); } }, 4000);
}
$('acon').onclick = () => ac('cool');
$('acoff').onclick = () => ac('off');
function step(d) { want.target = Math.min(30, Math.max(18, want.target + d)); want.dirty = true; acMsg = null; renderAc(); }
$('minus').onclick = () => step(-1);
$('plus').onclick = () => step(1);
$('fans').onclick = e => { const b = e.target.closest('button'); if (!b) return; want.fan = b.dataset.fan; want.dirty = true; acMsg = null; renderAc(); };
$('auto').onchange = async () => {
  const auto = $('auto').checked;
  try { await post('/api/ac', { auto }); cfg.auto = auto; acMsg = null; } catch { acMsg = 'autoFail'; }
  renderAc(); loadHistory();
};
$('save').onclick = async () => {
  const next = { ...cfg, tMin: +$('tmin').value, tMax: +$('tmax').value, hMin: +$('hmin').value, hMax: +$('hmax').value };
  if (![next.tMin, next.tMax, next.hMin, next.hMax].every(Number.isFinite) || next.tMin >= next.tMax || next.hMin >= next.hMax) { cfgMsg = 'cfgInvalid'; renderCfg(false); return; }
  try { await post('/api/profile', next, 'PUT'); cfg = next; cfgMsg = 'saved'; } catch { cfgMsg = 'saveFail'; }
  renderAll(); charts();
};
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  range = b.dataset.r;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  loadHistory();
};
for (const id of ['ct', 'ch']) { $(id).addEventListener('pointermove', tipAt); $(id).addEventListener('pointerdown', tipAt); }
window.addEventListener('resize', charts);

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  setLocale();
  renderAll(); charts(); renderLog();
}
$('langs').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch { /* storage may be blocked */ }
  applyLang();
};

lang = pickLang();
applyLang();
loadState(); loadHistory();
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
