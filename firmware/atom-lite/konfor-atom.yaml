# Konfor: M5Stack Atom Lite (IR LED GPIO12) + ENV III (SHT30 + QMP6988 on Grove I2C).
# Every 15 s it POSTs temperature/humidity to the Worker (/api/device) and gets the newest pending IR command back.
# The Worker converts the stored BroadLink codes to microsecond timings, so this file needs no IR codes.
# Secrets (secrets.yaml, see secrets.example.yaml): wifi_ssid, wifi_password, device_url, device_key, ota_password.

substitutions:
  name: konfor-atom
  report_interval: 15s

esphome:
  name: ${name}
  friendly_name: Konfor Atom
  on_boot:
    priority: -100
    then:
      - light.turn_on: {id: status_led, red: 0%, green: 0%, blue: 20%, brightness: 30%}

esp32:
  board: m5stack-atom

logger:
  level: INFO

# No Home Assistant: no `api:` block. OTA + the web flasher are enough.
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fall back to an own network if the router is gone, so the device can be reached for repair.
  ap:
    ssid: konfor-atom-setup
    password: !secret ota_password
  # Reboot if Wi-Fi stays down for 5 minutes.
  reboot_timeout: 5min

captive_portal:

i2c:
  sda: GPIO26
  scl: GPIO32
  scan: false

sensor:
  - platform: sht3xd
    address: 0x44
    update_interval: ${report_interval}
    temperature:
      id: room_temp
      name: Room temperature
      # filters:
      #   - offset: -0.5   # calibrate against a reference thermometer if needed
    humidity:
      id: room_hum
      name: Room humidity
  - platform: qmp6988
    address: 0x70
    update_interval: 60s
    pressure:
      name: Pressure
  - platform: wifi_signal
    id: rssi
    update_interval: 60s
  - platform: uptime
    id: up

remote_transmitter:
  id: ir_tx
  pin:
    number: GPIO12
    inverted: false
  eot_level: false
  carrier_duty_percent: 50%
  non_blocking: true

# Press GPIO39 to send the captured "off" frame once, independent of the Worker.
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: IR test button
    internal: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "IR test: sending off"
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [3448, -1839, 427, -394, 427, -394, 427, -1346, 427, -394, 427, -1346, 427, -394, 427, -394, 427, -394, 427, -1346, 427, -1346, 427, -394, 427, -394, 427, -394, 427, -1346, 427, -1346, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -1346, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -1346, 427, -394, 427, -394, 427, -394, 427, -394, 427, -1346, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -394, 427, -1346, 427, -394, 427, -1346, 427, -1346, 427, -1346, 427, -1346, 427, -1346, 427, -1346, 460]

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    channel_colors: GRB
    default_transition_length: 0s

globals:
  - id: last_cmd
    type: int
    initial_value: '0'
  - id: fails
    type: int
    initial_value: '0'

http_request:
  timeout: 10s
  watchdog_timeout: 15s
  verify_ssl: true

interval:
  - interval: ${report_interval}
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.post:
                url: !secret device_url
                request_headers:
                  x-device-key: !secret device_key
                  Content-Type: application/json
                json: |-
                  if (!isnan(id(room_temp).state) && !isnan(id(room_hum).state)) {
                    root["t"] = id(room_temp).state;
                    root["h"] = id(room_hum).state;
                  } else {
                    root["err"] = "sht30 no reading";
                  }
                  if (id(last_cmd) > 0) root["ack"] = id(last_cmd);
                  root["rssi"] = id(rssi).state;
                  root["up"] = (int) id(up).state;
                  root["fw"] = "atom-1";
                capture_response: true
                max_response_buffer_size: 4096
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: 'return response->status_code == 200;'
                        then:
                          - lambda: |-
                              id(fails) = 0;
                              id(last_cmd) = 0;
                              json::parse_json(body, [](JsonObject root) -> bool {
                                JsonObject cmd = root["cmd"];
                                if (cmd.isNull()) return true;
                                JsonArray raw = cmd["raw"];
                                std::vector<int32_t> data;
                                data.reserve(raw.size());
                                for (JsonVariant v : raw) data.push_back(v.as<int32_t>());
                                auto call = id(ir_tx).transmit();
                                call.get_data()->set_data(data);
                                call.get_data()->set_carrier_frequency(cmd["carrier"] | 38000);
                                call.perform();
                                id(last_cmd) = cmd["id"].as<int>();  // acked in the next report
                                ESP_LOGI("konfor", "IR sent: %s", cmd["name"].as<const char *>());
                                return true;
                              });
                          - light.turn_on: {id: status_led, red: 0%, green: 100%, blue: 0%, brightness: 20%}
                          - delay: 200ms
                          - light.turn_off: status_led
                        else:
                          - lambda: 'id(fails)++;'
                          - light.turn_on: {id: status_led, red: 100%, green: 0%, blue: 0%, brightness: 30%}
                on_error:
                  then:
                    - lambda: 'id(fails)++;'
                    - light.turn_on: {id: status_led, red: 100%, green: 0%, blue: 0%, brightness: 30%}
      # Server unreachable for ~5 minutes (20 x 15 s): restart (Wi-Fi/DNS/TLS state may be stuck).
      - if:
          condition:
            lambda: 'return id(fails) >= 20;'
          then:
            - logger.log: "Server unreachable, rebooting"
            - lambda: 'App.safe_reboot();'
